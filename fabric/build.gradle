plugins {
	id 'multiloader-loader'
	id 'net.fabricmc.fabric-loom-remap'
}

repositories {
	// Trinkets
	maven {
		url = 'https://maven.terraformersmc.com/releases'
		content { includeGroup('dev.emi') }
	}
	// Cardinal Components (dependencia de Trinkets)
	maven {
		url = 'https://maven.ladysnake.org/releases'
		content { includeGroupAndSubgroups('org.ladysnake') }
	}
	// Traveler's Backpack y Cosmetic Armor Reworked Forked
	maven {
		url = 'https://api.modrinth.com/maven'
		content { includeGroup('maven.modrinth') }
	}
	// Cloth Config y Architectury (solo para probar Traveler's Backpack / Cosmetic Armor)
	maven {
		url = 'https://maven.shedaniel.me/'
		content { includeGroup('me.shedaniel.cloth'); includeGroup('me.shedaniel') }
	}
	maven {
		url = 'https://maven.architectury.dev/'
		content { includeGroup('dev.architectury') }
	}
	// Accessories y owo-lib
	maven {
		url = 'https://maven.wispforest.io/releases'
		content { includeGroupAndSubgroups('io.wispforest') }
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

	// Compatibilidad opcional: solo para compilar, el mod no los exige.
	modCompileOnly("dev.emi:trinkets:${trinkets_version}") { exclude group: 'net.fabricmc.fabric-api' }
	modCompileOnly("io.wispforest:accessories-fabric:${accessories_version}") { exclude group: 'net.fabricmc.fabric-api' }
	modCompileOnly "maven.modrinth:travelersbackpack:${travelersbackpack_fabric}"
	modCompileOnly "maven.modrinth:cosmetic-armor-reworked-forked:${cosmeticarmor_fabric}"
	// La interfaz de la mochila extiende las de Cardinal Components.
	modCompileOnly "org.ladysnake.cardinal-components-api:cardinal-components-base:6.1.1"
	modCompileOnly "org.ladysnake.cardinal-components-api:cardinal-components-entity:6.1.1"

	// Para probarlos en desarrollo: ./gradlew :fabric:runSelftest -Pcompat=trinkets,accessories,backpack,cosmetic,hats
	// ("both" = trinkets,accessories).
	def compat = ((project.findProperty('compat') ?: '') as String).replace('both', 'trinkets,accessories').split(',') as List
	if ('trinkets' in compat) {
		modLocalRuntime("dev.emi:trinkets:${trinkets_version}") { exclude group: 'net.fabricmc.fabric-api' }
	}
	if ('accessories' in compat) {
		modLocalRuntime("io.wispforest:accessories-fabric:${accessories_version}") { exclude group: 'net.fabricmc.fabric-api' }
	}
	if ('backpack' in compat) {
		modLocalRuntime "maven.modrinth:travelersbackpack:${travelersbackpack_fabric}"
		modLocalRuntime "org.ladysnake.cardinal-components-api:cardinal-components-base:6.1.1"
		modLocalRuntime "org.ladysnake.cardinal-components-api:cardinal-components-entity:6.1.1"
		modLocalRuntime("me.shedaniel.cloth:cloth-config-fabric:15.0.140") { exclude group: 'net.fabricmc.fabric-api' }
	}
	if ('cosmetic' in compat) {
		modLocalRuntime "maven.modrinth:cosmetic-armor-reworked-forked:${cosmeticarmor_fabric}"
		modLocalRuntime("dev.architectury:architectury-fabric:13.0.8") { exclude group: 'net.fabricmc.fabric-api' }
	}
	// Solo para probar (usa Trinkets o Accessories para su ranura): Simple Hats.
	if ('hats' in compat) {
		modLocalRuntime "maven.modrinth:simple-hats:CBwzDCWX"
		modLocalRuntime("io.wispforest:owo-lib:0.12.15.4+1.21") { exclude group: 'net.fabricmc.fabric-api' }
	}
}

loom {
	mixin {
		defaultRefmapName.set("${mod_id}.refmap.json")
	}
	runs {
		// Mismo directorio de partida que antes del port (mundos, saves/selftest, capturas).
		client {
			runDir '../run'
		}
		server {
			runDir '../run'
		}
		// Autoprueba visual: ./gradlew :fabric:runSelftest (necesita run/saves/selftest).
		selftest {
			client()
			name "Self Test"
			runDir '../run'
			programArgs "--quickPlaySingleplayer", "selftest"
			vmArg "-Dchaosgravestone.selftest=true"
		}
	}
}
