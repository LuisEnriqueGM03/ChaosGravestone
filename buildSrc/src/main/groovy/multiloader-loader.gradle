plugins { id 'java-library' }
base.archivesName = "${mod_id}-${project.name}-${minecraft_version}"
java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
    withSourcesJar()
}
repositories {
    mavenCentral()
    maven { url = 'https://repo.spongepowered.org/repository/maven-public' }
}
sourceSets.main {
    java.srcDir '../common/src/main/java'
    resources.srcDir '../common/src/main/resources'
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = java_version as int
}
dependencies { compileOnly 'org.jetbrains:annotations:24.1.0' }
processResources {
    def props = [version: version, mod_id: mod_id, mod_name: mod_name, mod_author: mod_author,
                 license: license, minecraft_version_range: minecraft_version_range]
    inputs.properties(props)
    filesMatching(['fabric.mod.json', 'META-INF/mods.toml', 'META-INF/neoforge.mods.toml']) { expand props }
}
jar {
    from(rootProject.file('LICENSE')) { rename { "${it}_${mod_id}" } }
}
