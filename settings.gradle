pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.neoforged.net/releases' }
        mavenCentral()
        gradlePluginPortal()
    }
}
rootProject.name = 'chaosgravestone'
def selectedLoader = providers.gradleProperty('loader')
    .orElse(providers.gradleProperty('default_loader').orElse('fabric')).get()
if (selectedLoader == 'all') {
    include('fabric', 'neoforge', 'forge')
} else if (selectedLoader in ['fabric', 'neoforge', 'forge']) {
    include(selectedLoader)
} else {
    throw new GradleException('loader debe ser fabric, neoforge, forge o all')
}
