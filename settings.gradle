pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		maven {
			name = 'NeoForged'
			url = 'https://maven.neoforged.net/releases'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

rootProject.name = 'chaosgravestone'

// common: código compartido (solo Minecraft vanilla). fabric / neoforge: arranque y eventos de cada cargador.
include('common')
include('fabric')
include('neoforge')
