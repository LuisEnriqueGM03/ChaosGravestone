plugins {
    id 'multiloader-loader'
    id 'net.minecraftforge.gradle'
}
minecraft {
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir("run-${minecraft_version}")
            args '--mixin.config', "${mod_id}.mixins.json"
        }
        register('client') {
            if (project.hasProperty('selftest')) systemProperty 'chaosgravestone.selftest', 'true'
        }
        register('server') { args '--nogui' }

    }
}
repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}
dependencies { implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}") }
jar { manifest { attributes('MixinConfigs': "${mod_id}.mixins.json") } }
// Forge 62 bundles Mixin 0.8.7, whose compatibility enum ends before JAVA_25.
// The mixins use Java 21 features; the mod and Minecraft still run with Java 25.
processResources {
    inputs.property('mixinCompatibilityLevel', 'JAVA_21')
    filesMatching("${mod_id}.mixins.json") {
        filter { line -> line.replace('JAVA_25', 'JAVA_21') }
    }
}
