plugins {
	id 'multiloader-loader'
	id 'net.neoforged.moddev'
}

repositories {
	// Curios
	maven {
		url = 'https://maven.theillusivec4.top/'
		content { includeGroup('top.theillusivec4.curios') }
	}
	// Traveler's Backpack y Cosmetic Armor Reworked Forked
	maven {
		url = 'https://api.modrinth.com/maven'
		content { includeGroup('maven.modrinth') }
	}
	// Cosmetic Armor Reworked: solo publica en las releases de GitHub
	ivy {
		url = 'https://github.com/zlainsama/CosmeticArmorReworked/releases/download/'
		patternLayout { artifact '[revision]/[module]-[revision].[ext]' }
		metadataSources { artifact() }
		content { includeGroup('zlainsama') }
	}
}

dependencies {
	// Compatibilidad opcional: solo la API para compilar, el mod no la exige.
	compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}:api"
	compileOnly "maven.modrinth:travelersbackpack:${travelersbackpack_neoforge}"
	compileOnly "zlainsama:cosmeticarmorreworked:${cosmeticarmor_neoforge}"
	// Para probarlos en desarrollo: ./gradlew :neoforge:runSelftest -Pcompat=curios,backpack,cosmetic,sophisticated,hats
	def compat = ((project.findProperty('compat') ?: '') as String).split(',') as List
	if ('curios' in compat) {
		runtimeOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}"
	}
	if ('backpack' in compat) {
		runtimeOnly "maven.modrinth:travelersbackpack:${travelersbackpack_neoforge}"
	}
	if ('cosmetic' in compat) {
		runtimeOnly "zlainsama:cosmeticarmorreworked:${cosmeticarmor_neoforge}"
	}
	// Solo para probar (usan Curios para su ranura): Sophisticated Backpacks y Simple Hats.
	if ('sophisticated' in compat) {
		runtimeOnly "maven.modrinth:sophisticated-backpacks:eg9lPtG4"
		runtimeOnly "maven.modrinth:sophisticated-core:gtPF4VTh"
	}
	if ('hats' in compat) {
		runtimeOnly "maven.modrinth:simple-hats:t7zbSooi"
		runtimeOnly "maven.modrinth:owo-lib:wbdHEItB"
	}
}

neoForge {
	version = neoforge_version
	runs {
		client {
			client()
			gameDirectory = file('run')
		}
		server {
			server()
			gameDirectory = file('run')
		}
		// Autoprueba visual: ./gradlew :neoforge:runSelftest (necesita neoforge/run/saves/selftest).
		selftest {
			client()
			gameDirectory = file('run')
			programArguments.addAll('--quickPlaySingleplayer', 'selftest')
			systemProperty('chaosgravestone.selftest', 'true')
		}
	}
	mods {
		"${mod_id}" {
			sourceSet sourceSets.main
		}
	}
}
