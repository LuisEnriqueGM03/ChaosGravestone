plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}
neoForge {
    version = neoforge_version
    runs {
        client { client(); gameDirectory = file("run-${minecraft_version}") }
        server { server(); gameDirectory = file("run-${minecraft_version}"); programArgument '--nogui' }
        selftest { client(); gameDirectory = file("run-${minecraft_version}"); systemProperty 'chaosgravestone.selftest', 'true' }
    }
    mods { "${mod_id}" { sourceSet sourceSets.main } }
}
